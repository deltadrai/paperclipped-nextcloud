name: release
on:
  push: { tags: ["v*"] }
permissions: { contents: read }

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, platform: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, platform: linux/arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p paperclipped-nextcloud
      - name: Package binary
        run: |
          name=paperclipped-nextcloud-${GITHUB_REF_NAME}-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/paperclipped-nextcloud "$name"
          strip "$name" || true
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: paperclipped-nextcloud-*
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push the per-arch image
        run: |
          image=ghcr.io/${{ github.repository }}
          docker build -f Containerfile --platform ${{ matrix.platform }} -t "$image:${GITHUB_REF_NAME}-${{ matrix.arch }}" .
          docker push "$image:${GITHUB_REF_NAME}-${{ matrix.arch }}"

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Multi-arch image
        run: |
          image=ghcr.io/${{ github.repository }}
          docker buildx imagetools create -t "$image:${GITHUB_REF_NAME}" -t "$image:latest" \
            "$image:${GITHUB_REF_NAME}-amd64" "$image:${GITHUB_REF_NAME}-arm64"
          docker buildx imagetools inspect "$image:${GITHUB_REF_NAME}" | tee dist/image.txt
      - name: GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "${{ github.repository }}" --generate-notes
